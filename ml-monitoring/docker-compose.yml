services:
  prometheus:
    image: prom/prometheus:latest
    platform: linux/amd64
    container_name: ml-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    platform: linux/amd64
    container_name: ml-grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
